name: Verify final live app

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check final Soft H4H deployment
        run: |
          BASE="https://triton-soft-h4h-final-elmu-2020.vercel.app"
          for ATTEMPT in $(seq 1 24); do
            if curl -fsSL --max-time 10 "${BASE}/" -o /tmp/index.html; then
              CSS=$(grep -oE 'href="/assets/[^"]+\.css"' /tmp/index.html | head -1 | cut -d'"' -f2 || true)
              if [ -n "${CSS}" ] && curl -fsSL --max-time 10 "${BASE}${CSS}" -o /tmp/app.css && grep -q -- "--h4h-fullscreen-release:20260904" /tmp/app.css; then
                echo "Final Soft H4H deployment is live."
                exit 0
              fi
            fi
            sleep 5
          done
          exit 1
