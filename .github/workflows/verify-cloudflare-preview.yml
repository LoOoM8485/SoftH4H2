name: Verify final live app

on:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose final Soft H4H deployment
        run: |
          for URL in \
            "https://triton-soft-h4h-final-el66gv9zb-elmu-2020.vercel.app/" \
            "https://triton-soft-h4h-final-elmu-2020.vercel.app/"; do
            echo "Checking ${URL}"
            curl -sS -L --max-time 20 -o /tmp/page.html -w "HTTP=%{http_code} FINAL=%{url_effective}\n" "${URL}" || true
            head -c 300 /tmp/page.html 2>/dev/null || true
            echo
          done
