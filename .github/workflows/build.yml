name: Build & live check

on:
  push:
    branches: [main, app-refresh-2026]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Check Cloudflare production app
        if: github.ref == 'refs/heads/main'
        run: |
          BASE="https://softh4h.elmu-bfb.workers.dev"
          for ATTEMPT in $(seq 1 24); do
            if curl -fsSL --max-time 8 "${BASE}/" -o /tmp/index.html; then
              CSS=$(grep -oE 'href="/assets/[^"]+\.css"' /tmp/index.html | head -1 | cut -d'"' -f2 || true)
              if [ -n "${CSS}" ] && curl -fsSL --max-time 8 "${BASE}${CSS}" -o /tmp/app.css; then
                if grep -q -- "--h4h-fullscreen-release:20260904" /tmp/app.css; then
                  echo "Cloudflare production contains the fullscreen/touch release."
                  exit 0
                fi
              fi
            fi

            echo "Waiting for Cloudflare deployment (${ATTEMPT}/24)…"
            sleep 5
          done

          echo "Cloudflare production did not expose the expected release marker."
          exit 1
